# Copy to .github/workflows/ in your app's repository.
# Every pull request: compare production with the PR's preview deployment and
# post the result as a single, updated PR comment.
name: "QA: preview vs production"

on:
  pull_request:

  # Alternative for hosts that report deployments to GitHub (Vercel, Netlify,
  # Render…): run when the preview is actually up, and use its URL directly.
  # deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    # With deployment_status, also require: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Compare
        id: envdiff
        uses: suchith-arella/envdiff@main
        continue-on-error: true
        with:
          baseline: https://www.example.com
          # The PR's branch; the template turns it into the preview URL.
          candidate: branch:${{ github.head_ref }}
          url-template: https://{branch}--example.netlify.app
          # With deployment_status instead:
          # candidate: ${{ github.event.deployment_status.environment_url }}
          viewports: desktop,mobile
          fail-on: major
          config: envdiff.config.yaml

      - name: Comment on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT_DIR: ${{ steps.envdiff.outputs.report-dir }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const file = path.join(process.env.REPORT_DIR || 'envdiff-report', 'summary.md');
            if (!fs.existsSync(file)) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- envdiff -->';
            const body = `${marker}\n${fs.readFileSync(file, 'utf8')}\n[Workflow run and report artifact](${runUrl})`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Fail on regressions
        if: steps.envdiff.outcome == 'failure'
        run: exit 1
